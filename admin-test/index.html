<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APP V9 Beta · Prueba de acceso</title><style>body{font:16px system-ui;background:#f5f7fb;color:#182235;padding:32px 12px}.card{max-width:490px;margin:auto;background:white;border:1px solid #dde4f0;border-radius:16px;padding:24px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px;border-radius:8px;font:inherit}input{border:1px solid #b8c4d4}button{border:0;background:#2149ad;color:white;cursor:pointer}button:disabled{opacity:.5}#message{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#566479}</style></head><body><main class="card"><h1>APP V9 Beta</h1><p>Prueba de autenticación y permisos administrativos. Solo lectura; no modifica expedientes ni Miro.</p><label for="email">Correo de Supabase Authentication</label><input id="email" type="email" autocomplete="username"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="login" disabled>Iniciar sesión</button><button id="check" disabled>Comprobar permisos administrativos</button><button id="logout" disabled>Cerrar sesión</button><p id="message" role="status">Preparando conexión…</p><small>Utiliza exclusivamente la contraseña de tu usuario de prueba. No compartas contraseñas ni tokens.</small></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://odfrhfvpijnbfvrlkxkn.supabase.co',key='sb_publishable_rs-cB3tiIhg1IVBNPxbSrw_P_rHyVCd';
const sb=createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const el=id=>document.getElementById(id),say=t=>el('message').textContent=t;
let signedIn=false;const controls=()=>{el('login').disabled=signedIn;el('check').disabled=!signedIn;el('logout').disabled=!signedIn;};
el('login').disabled=false;say('Introduce el correo y la contraseña de tu usuario de prueba.');
el('login').onclick=async()=>{el('login').disabled=true;say('Verificando credenciales…');try{const {data,error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error)throw error;signedIn=!!data.session;say(signedIn?'Inicio de sesión correcto. Pulsa «Comprobar permisos administrativos».':'No se obtuvo sesión.');}catch(e){say('No se pudo iniciar sesión: '+e.message);}controls();};
el('check').onclick=async()=>{say('Consultando autorización de prueba…');try{const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('No hay sesión activa');const r=await fetch(url+'/functions/v1/v9-admin-test-access-check',{method:'POST',headers:{authorization:'Bearer '+session.access_token,apikey:key,'content-type':'application/json'},body:'{}',cache:'no-store'});const result=await r.json();if(r.ok&&result.authorized===true&&result.read_only===true)say('ACCESO ADMINISTRATIVO DE PRUEBA CONFIRMADO (HTTP '+r.status+'). Solo lectura.');else say('Resultado de autorización: HTTP '+r.status+'; estado: '+String(result.status||'desconocido')+'; autorizado: '+String(result.authorized===true));}catch(e){say('No se pudo verificar: '+e.message);}};
el('logout').onclick=async()=>{await sb.auth.signOut();signedIn=false;controls();say('Sesión cerrada.');};
</script></body></html>
